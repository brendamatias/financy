services:
  server:
    build:
      context: ./financy-server
      target: runtime
    environment:
      DATABASE_URL: file:/app/data/financy.db
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      - financy-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  app:
    build:
      context: ./financy-app
      target: runtime
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:4000/graphql}
        VITE_GRAPHQL_MOCK: ${VITE_GRAPHQL_MOCK:-false}
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  financy-data:
